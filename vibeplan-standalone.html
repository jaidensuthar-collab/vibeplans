    planningNotes: 'Use Wheelofnames.com. Add 10+ options. No vetoing the result.',
  },
];

// ─── Mock Planner ─────────────────────────────────────────────────────────────

const BUDGET_KW = { free:0, cheap:10, low:10, broke:5, '$5':5, '$10':10, '$15':15, '$20':20, '$25':25, '$30':30, '$50':50 };
const VIBE_KW = { chill:'chill', relax:'chill', lowkey:'chill', calm:'chill', easy:'chill', random:'random-adventure', adventure:'random-adventure', spontaneous:'random-adventure', active:'active', sporty:'active', energetic:'active', creative:'creative', artsy:'creative', social:'social', hangout:'social' };
const DIST_KW = { walking:5, nearby:10, close:10, '10 min':10, '15 min':15, '20 min':20, '25 min':25, '30 min':30 };

function parsePrompt(raw) {
  const lower = raw.toLowerCase();
  let budget, distanceMinutes;
  const vibes = [];
  const dollarMatch = lower.match(/\$(\d+)/g);
  if (dollarMatch) budget = Math.max(...dollarMatch.map(d => parseInt(d.replace('$', ''))));
  for (const [kw, val] of Object.entries(BUDGET_KW)) { if (lower.includes(kw) && budget === undefined) budget = val; }
  const minMatch = lower.match(/(\d+)\s*min/);
  if (minMatch) distanceMinutes = parseInt(minMatch[1]);
  for (const [kw, val] of Object.entries(DIST_KW)) { if (lower.includes(kw) && distanceMinutes === undefined) distanceMinutes = val; }
  for (const [kw, vibe] of Object.entries(VIBE_KW)) { if (lower.includes(kw) && !vibes.includes(vibe)) vibes.push(vibe); }
  const groupMatch = lower.match(/(\d+)\s*people/);
  const groupSize = groupMatch ? parseInt(groupMatch[1]) : undefined;
  return { budget, distanceMinutes, vibes, groupSize, rawText: raw };
}

const DIST_ORDER = { walking:5, nearby:10, 'short-drive':25, 'road-trip':60 };

function rankActivities(prompt, pool = activities) {
  const scored = pool.map(a => {
    let score = 50;
    // budget
    if (prompt.budget !== undefined) { score += a.estimatedCostMax <= prompt.budget ? 20 : a.estimatedCostMin <= prompt.budget ? 5 : -20; }
    else { score += 10; }
    // distance
    const am = DIST_ORDER[a.distanceType];
    if (prompt.distanceMinutes !== undefined) { score += am <= prompt.distanceMinutes ? 15 : am <= prompt.distanceMinutes * 1.3 ? 5 : -15; }
    else { score += 10; }
    // vibe
    if (prompt.vibes.length === 0) { score += 10; }
    else { score += prompt.vibes.filter(v => a.vibes.includes(v)).length * 15; }
    // warning penalty
    score += a.warnings.length * -3;

    const reasons = [];
    if (prompt.budget !== undefined && a.estimatedCostMax <= prompt.budget) reasons.push(`fits your $${prompt.budget} budget`);
    if (prompt.distanceMinutes !== undefined && am <= prompt.distanceMinutes) reasons.push('within your drive limit');
    const mv = prompt.vibes.filter(v => a.vibes.includes(v));
    if (mv.length > 0) reasons.push(`matches ${mv.join(', ')} vibe`);
    if (a.effortLevel === 'low') reasons.push('easy to coordinate');
    if (reasons.length === 0) reasons.push('solid all-around option');

    return { activity: a, score, rankingReason: `Ranked because it ${reasons.join(', ')}.` };
  });
  return scored.sort((a, b) => b.score - a.score).slice(0, 3);
}

function rankWithConstraints(rawPrompt, constraints) {
  const base = parsePrompt(rawPrompt);
  const budgets = constraints.map(c => c.maxBudget).filter(b => b !== undefined);
  const dists = constraints.map(c => c.maxDistanceMinutes).filter(d => d !== undefined);
  return rankActivities({
    ...base,
    budget: budgets.length > 0 ? Math.min(...budgets, base.budget ?? Infinity) : base.budget,
    distanceMinutes: dists.length > 0 ? Math.min(...dists, base.distanceMinutes ?? Infinity) : base.distanceMinutes,
  });
}

function generateImprovedPlan(ranked, constraints) {
  const { activity } = ranked;
  const minB = constraints.map(c => c.maxBudget).filter(b => b !== undefined);
  const budgetNote = minB.length > 0 ? `under $${Math.min(...minB)} per person` : `around $${activity.estimatedCostMax} per person`;
  return {
    activityTitle: activity.title,
    polishedPlan: `Meet up and head out for ${activity.title.toLowerCase()}. Keep costs ${budgetNote} and stay within ${activity.distanceType === 'nearby' ? '15 minutes' : '25 minutes'} of your starting point. Plan for ${activity.timeNeeded} — ${activity.summary.toLowerCase()}`,
    nearbyOptions: ['Local park or green space', 'Nearby shopping center or strip', 'Scenic outdoor spot or overlook'],
    backupPlan: activity.indoorOutdoor === 'outdoor'
      ? 'If weather turns bad, switch to a coffee shop, board game night, or car playlist drive instead.'
      : 'If the main spot is full or closed, pick the next closest option on the list.',
  };
}

// ─── Group Utilities ──────────────────────────────────────────────────────────

function generateGroupCode() { return `VP-${Math.floor(1000 + Math.random() * 9000)}`; }
function createGroup(prompt) { return { id: Math.random().toString(36).slice(2), code: generateGroupCode(), prompt, constraints: [], topActivities: [], votes: [] }; }
function addVote(group, memberId, activityId) { return { ...group, votes: [...group.votes.filter(v => v.memberId !== memberId), { memberId, activityId }] }; }
function getVoteCounts(group) { return group.votes.reduce((acc, v) => { acc[v.activityId] = (acc[v.activityId] ?? 0) + 1; return acc; }, {}); }
function getWinningId(group) { const e = Object.entries(getVoteCounts(group)); return e.length ? e.sort((a,b) => b[1]-a[1])[0][0] : undefined; }

// ─── Warning Badge ────────────────────────────────────────────────────────────

const BADGE_COLORS = {
  'late-night': 'bg-purple-100 text-purple-800 dark:bg-purple-900 dark:text-purple-200',
  'needs-ride': 'bg-blue-100 text-blue-800 dark:bg-blue-900 dark:text-blue-200',
  'cost-risk': 'bg-yellow-100 text-yellow-800 dark:bg-yellow-900 dark:text-yellow-200',
  'weather-risk': 'bg-sky-100 text-sky-800 dark:bg-sky-900 dark:text-sky-200',
  'far-drive': 'bg-orange-100 text-orange-800 dark:bg-orange-900 dark:text-orange-200',
  'planning-needed': 'bg-red-100 text-red-800 dark:bg-red-900 dark:text-red-200',
};
const BADGE_LABELS = { 'late-night':'Late Night', 'needs-ride':'Needs Ride', 'cost-risk':'Cost Risk', 'weather-risk':'Weather Risk', 'far-drive':'Far Drive', 'planning-needed':'Plan Ahead' };

function WarningBadge({ badge }) {
  return (
    <span className={`inline-flex items-center text-xs font-medium px-2 py-0.5 rounded-full ${BADGE_COLORS[badge.type]}`} title={badge.reason}>
      {BADGE_LABELS[badge.type]}
    </span>
  );
}

// ─── Activity Card ────────────────────────────────────────────────────────────

function ActivityCard({ ranked, rank, onVote, voted, voteCount }) {
  const { activity, rankingReason } = ranked;
  return (
    <div className="rounded-2xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 p-4 shadow-sm space-y-2">
      <div className="flex items-center justify-between">
        <span className="text-xs font-semibold text-indigo-500 uppercase tracking-wide">#{rank}</span>
        <span className="text-xs text-gray-400 dark:text-gray-500">{activity.effortLevel} effort</span>
      </div>
      <h3 className="text-lg font-bold text-gray-900 dark:text-white">{activity.title}</h3>
      <p className="text-sm text-gray-600 dark:text-gray-300">{activity.summary}</p>
      <div className="grid grid-cols-2 gap-1 text-xs text-gray-500 dark:text-gray-400">
        <span>💰 ${activity.estimatedCostMin}–${activity.estimatedCostMax}/person</span>
        <span>⏱ {activity.timeNeeded}</span>
        <span>📍 {activity.distanceType}</span>
        <span>🏷 {activity.bestFor}</span>
      </div>
      <p className="text-xs text-indigo-600 dark:text-indigo-400 italic">{rankingReason}</p>
      {activity.warnings.length > 0 && (
        <div className="flex flex-wrap gap-1">
          {activity.warnings.map(w => <WarningBadge key={w.type} badge={w} />)}
        </div>
      )}
      {onVote && (
        <button
          onClick={onVote}
          className={`w-full mt-2 py-2 rounded-xl text-sm font-semibold transition-colors ${voted ? 'bg-indigo-600 text-white' : 'bg-gray-100 dark:bg-gray-700 text-gray-800 dark:text-gray-100 hover:bg-indigo-50 dark:hover:bg-gray-600'}`}
        >
          {voted ? `Voted ✓ (${voteCount ?? 0})` : `Vote${voteCount ? ` (${voteCount})` : ''}`}
        </button>
      )}
    </div>
  );
}

// ─── Empty State ──────────────────────────────────────────────────────────────

function EmptyState({ message, hint }) {
  return (
    <div className="text-center py-12 px-4">
      <p className="text-2xl mb-2">🌞</p>
      <p className="text-gray-600 dark:text-gray-300 font-medium">{message}</p>
      {hint && <p className="text-sm text-gray-400 dark:text-gray-500 mt-1">{hint}</p>}
    </div>
  );
}

// ─── Mode Card ────────────────────────────────────────────────────────────────

function ModeCard({ title, description, emoji, onClick }) {

    <button
      onClick={onClick}
      className="w-full text-left rounded-2xl border-2 border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 p-6 hover:border-indigo-400 dark:hover:border-indigo-500 hover:shadow-md transition-all group"
    >
      <div className="text-4xl mb-3">{emoji}</div>
      <h2 className="text-xl font-bold text-gray-900 dark:text-white group-hover:text-indigo-600 dark:group-hover:text-indigo-400">{title}</h2>
      <p className="text-sm text-gray-500 dark:text-gray-400 mt-1">{description}</p>

}

// ─── Header ───────────────────────────────────────────────────────────────────

function Header({ dark, onToggle, onHome }) {

    <header className="flex items-center justify-between px-4 py-3 border-b border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-900 sticky top-0 z-10">
      <button onClick={onHome} className="text-xl font-bold text-indigo-600 dark:text-indigo-400 tracking-tight hover:opacity-80 transition-opacity">
        VibePlan
      </button>
      <button
        onClick={onToggle}
        aria-label="Toggle dark mode"
        className="rounded-full p-2 bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 transition-colors"
      >
        {dark ? '☀️' : '🌙'}
      </button>

}

// ─── Home Page ────────────────────────────────────────────────────────────────

function HomePage({ onSelect }) {
  return (
    <main className="max-w-md mx-auto px-4 py-10 space-y-8">
      <section className="text-center space-y-2">
        <h1 className="text-4xl font-extrabold text-gray-900 dark:text-white">VibePlan</h1>
        <p className="text-lg text-indigo-600 dark:text-indigo-400 font-medium">Find the vibe. Make the plan.</p>
        <p className="text-sm text-gray-500 dark:text-gray-400">Get ranked summer hangout ideas for you or your friend group.</p>
      </section>
      <div className="space-y-4">
        <ModeCard emoji="💬" title="Chat Mode" description="Describe what you're feeling and get ranked ideas fast. Great for quick inspiration when you're bored." onClick={() => onSelect('chat')} />
        <ModeCard emoji="👥" title="Group Mode" description="Create a group code, gather everyone's constraints, and vote on the best plan together." onClick={() => onSelect('group')} />
      </div>
      <p className="text-center text-xs text-gray-400 dark:text-gray-600">No login. No drama. Just plans.</p>
    </main>
  );
}

// ─── Chat Mode ────────────────────────────────────────────────────────────────

const CHIPS = [
  'Bored tonight, 5 people, $15 each, within 20 minutes',
  'Something chill with friends this afternoon',
  'Random adventure, no idea where, cheap',
];

function ChatMode() {
  const [input, setInput] = useState('');
  const [results, setResults] = useState([]);
  const [submitted, setSubmitted] = useState(false);
  const [error, setError] = useState('');

  function handleSubmit() {
    const t = input.trim();
    if (!t) { setError('Type something so VibePlan can rank ideas for you.'); return; }
    if (t.length < 5) { setError('Add a little more detail. Try adding a budget, vibe, or drive limit.'); return; }
    setError('');
    setResults(rankActivities(parsePrompt(t)));
    setSubmitted(true);
  }

  return (
    <main className="max-w-md mx-auto px-4 py-6 space-y-6">
      <div>
        <h2 className="text-2xl font-bold text-gray-900 dark:text-white">Chat Mode</h2>
        <p className="text-sm text-gray-500 dark:text-gray-400 mt-1">Tell VibePlan what you're feeling. Mention your budget, how far you'll drive, and the vibe.</p>
      </div>
      <div className="space-y-3">
        <textarea
          className="w-full rounded-xl border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 text-gray-900 dark:text-white p-3 text-sm resize-none focus:outline-none focus:ring-2 focus:ring-indigo-400 placeholder-gray-400"
          rows={3}
          placeholder="We're bored tonight, 5 people, $15 each, nothing more than 20 minutes away..."
          value={input}
          onChange={e => setInput(e.target.value)}
          onKeyDown={e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSubmit(); } }}
        />
        {error && <p className="text-sm text-red-500">{error}</p>}
        <div className="flex flex-wrap gap-2">
          {CHIPS.map(c => (
            <button key={c} onClick={() => setInput(c)}
              className="text-xs bg-indigo-50 dark:bg-indigo-900/50 text-indigo-700 dark:text-indigo-300 px-2.5 py-1 rounded-lg hover:bg-indigo-100 dark:hover:bg-indigo-800 transition-colors">
              {c}
            </button>
          ))}
        </div>
        <button onClick={handleSubmit} className="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl transition-colors">
          Find Ideas
        </button>
      </div>
      {submitted && results.length === 0 && <EmptyState message="No ideas matched." hint="Try adding a budget, vibe, or drive limit." />}
      {results.length > 0 && (
        <section className="space-y-4">
          <h3 className="text-lg font-semibold text-gray-800 dark:text-gray-100">Top 3 Ideas</h3>
          {results.map((r, i) => <ActivityCard key={r.activity.id} ranked={r} rank={i + 1} />)}
          <p className="text-xs text-center text-gray-400 dark:text-gray-600 pb-4">Powered by mock AI — OpenAI integration coming in Phase 3</p>
        </section>
      )}
    </main>
  );
}

// ─── Improved Plan Card ───────────────────────────────────────────────────────

function ImprovedPlanCard({ plan }) {
  return (
    <div className="rounded-2xl border-2 border-indigo-400 dark:border-indigo-500 bg-indigo-50 dark:bg-indigo-900/30 p-5 space-y-4">
      <h4 className="text-lg font-bold text-indigo-700 dark:text-indigo-300">✨ Improved Plan: {plan.activityTitle}</h4>
      <div>
        <p className="text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wide mb-1">Polished Plan</p>
        <p className="text-sm text-gray-800 dark:text-gray-100 leading-relaxed">{plan.polishedPlan}</p>
      </div>
      <div>
        <p className="text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wide mb-1">Nearby Options</p>
        <ul className="space-y-1">
          {plan.nearbyOptions.map(o => <li key={o} className="text-sm text-gray-700 dark:text-gray-300 flex gap-1"><span className="text-indigo-400">•</span>{o}</li>)}
        </ul>
      </div>
      <div>
        <p className="text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wide mb-1">Backup Plan</p>
        <p className="text-sm text-gray-700 dark:text-gray-300 italic">{plan.backupPlan}</p>
      </div>
    </div>
  );
}

// ─── Vote Panel ───────────────────────────────────────────────────────────────

function VotePanel({ activities, voteCounts, userVote, winningId, onVote }) {
  return (
    <div className="space-y-4">
      {activities.map((r, i) => (
        <div key={r.activity.id} className={`transition-all ${winningId === r.activity.id ? 'ring-2 ring-indigo-500 rounded-2xl' : ''}`}>
          {winningId === r.activity.id && <div className="text-center text-xs font-bold text-indigo-600 dark:text-indigo-400 mb-1">👑 Winner</div>}
          <ActivityCard ranked={r} rank={i + 1} onVote={() => onVote(r.activity.id)} voted={userVote === r.activity.id} voteCount={voteCounts[r.activity.id] ?? 0} />
        </div>
      ))}
    </div>
  );
}

// ─── Group Mode ───────────────────────────────────────────────────────────────

function GroupMode() {
  const [step, setStep] = useState('entry');
  const [group, setGroup] = useState(null);
  const [prompt, setPrompt] = useState('');
  const [promptError, setPromptError] = useState('');
  const [myName, setMyName] = useState('');
  const [myBudget, setMyBudget] = useState('');
  const [myDist, setMyDist] = useState('');
  const [improvedPlan, setImprovedPlan] = useState(null);
  const [myId] = useState(() => Math.random().toString(36).slice(2));

  function handleCreate() {
    if (!prompt.trim()) { setPromptError('Enter a prompt for your group.'); return; }
    setPromptError('');
    const g = createGroup(prompt);
    setGroup({ ...g, topActivities: rankWithConstraints(prompt, []) });
    setStep('setup');
  }

  function handleConstraintAndVote() {
    if (!group) return;
    const c = { memberId: myId, name: myName || 'Me', maxBudget: myBudget ? parseInt(myBudget) : undefined, maxDistanceMinutes: myDist ? parseInt(myDist) : undefined };
    const updated = { ...group, constraints: [...group.constraints.filter(x => x.memberId !== myId), c] };
    setGroup({ ...updated, topActivities: rankWithConstraints(group.prompt, updated.constraints) });
    setStep('vote');
  }

  function handleVote(activityId) {
    if (!group) return;
    const updated = addVote(group, myId, activityId);
    setGroup({ ...updated, winningActivityId: getWinningId(updated) });
  }

  function handleImprove() {
    if (!group?.winningActivityId) return;
    const winner = group.topActivities.find(r => r.activity.id === group.winningActivityId);
    if (!winner) return;
    setImprovedPlan(generateImprovedPlan(winner, group.constraints));
    setStep('improved');
  }

  function handleReset() { setStep('entry'); setGroup(null); setPrompt(''); setPromptError(''); setMyName(''); setMyBudget(''); setMyDist(''); setImprovedPlan(null); }

  const voteCounts = group ? getVoteCounts(group) : {};

  return (
    <main className="max-w-md mx-auto px-4 py-6 space-y-6">
      <h2 className="text-2xl font-bold text-gray-900 dark:text-white">Group Mode</h2>

      {step === 'entry' && (
        <div className="space-y-4">
          <p className="text-sm text-gray-500 dark:text-gray-400">Create a group, get a shareable code, and vote on the best plan together.</p>
          <textarea
            className="w-full rounded-xl border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 text-gray-900 dark:text-white p-3 text-sm resize-none focus:outline-none focus:ring-2 focus:ring-indigo-400 placeholder-gray-400"
            rows={2} placeholder="5 people, bored tonight, random adventure, $20 each, within 25 minutes..."
            value={prompt} onChange={e => setPrompt(e.target.value)}
          />
          {promptError && <p className="text-sm text-red-500">{promptError}</p>}
          <button onClick={handleCreate} className="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl transition-colors">Create Group</button>
        </div>
      )}

      {step === 'setup' && group && (
        <div className="space-y-4">
          <div className="rounded-xl bg-indigo-50 dark:bg-indigo-900/30 p-4 text-center border border-indigo-200 dark:border-indigo-700">
            <p className="text-xs text-gray-500 dark:text-gray-400 mb-1">Share this code with your group</p>
            <p className="text-3xl font-extrabold text-indigo-600 dark:text-indigo-400 tracking-widest">{group.code}</p>
            <p className="text-xs text-gray-400 dark:text-gray-500 mt-1">Demo only — local session</p>
          </div>
          <p className="text-sm font-medium text-gray-700 dark:text-gray-200">Add your constraints (optional)</p>
          {[['Your name', myName, setMyName, 'text'], ['Max budget per person ($)', myBudget, setMyBudget, 'number'], ['Max drive time (minutes)', myDist, setMyDist, 'number']].map(([ph, val, set, type]) => (
            <input key={ph} placeholder={ph} type={type} value={val} onChange={e => set(e.target.value)}
              className="w-full rounded-xl border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 text-gray-900 dark:text-white p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400 placeholder-gray-400" />
          ))}
          <button onClick={handleConstraintAndVote} className="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl transition-colors">See Top Ideas &amp; Vote</button>
        </div>
      )}

      {step === 'vote' && group && (
        <div className="space-y-4">
          <p className="text-sm text-gray-500 dark:text-gray-400">Vote for the plan you like best. The winner will be highlighted.</p>
          {group.topActivities.length === 0
            ? <EmptyState message="No ideas matched those constraints." hint="Try loosening the budget or distance limit." />
            : <VotePanel activities={group.topActivities} voteCounts={voteCounts} userVote={group.votes.find(v => v.memberId === myId)?.activityId} winningId={group.winningActivityId} onVote={handleVote} />}
          {group.winningActivityId && (
            <button onClick={handleImprove} className="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-xl transition-colors">✨ Improve Winning Plan</button>
          )}
          <button onClick={handleReset} className="w-full py-2 bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 rounded-xl text-sm hover:bg-gray-200 dark:hover:bg-gray-600 transition-colors">Start Over</button>
        </div>
      )}

      {step === 'improved' && improvedPlan && (
        <div className="space-y-4">
          <ImprovedPlanCard plan={improvedPlan} />
          <button onClick={handleReset} className="w-full py-2 bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-200 rounded-xl text-sm hover:bg-gray-200 dark:hover:bg-gray-600 transition-colors">Start Over</button>
        </div>
      )}
    </main>
  );
}

// ─── App Root ─────────────────────────────────────────────────────────────────

function App() {
  const [dark, setDark] = useState(() => window.matchMedia('(prefers-color-scheme: dark)').matches);
  const [page, setPage] = useState('home');

  useEffect(() => {
    document.documentElement.classList.toggle('dark', dark);
  }, [dark]);

  return (
    <div className="min-h-screen bg-gray-50 dark:bg-gray-900 transition-colors duration-200">
      <Header dark={dark} onToggle={() => setDark(d => !d)} onHome={() => setPage('home')} />
      {page === 'home' && <HomePage onSelect={setPage} />}
      {page === 'chat' && <ChatMode />}
      {page === 'group' && <GroupMode />}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>

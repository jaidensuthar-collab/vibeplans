services:
  - type: web
    name: vibeplan-api
    runtime: python
    rootDir: .
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vibeplan-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: https://vibeplan.netlify.app

databases:
  - name: vibeplan-db
    databaseName: vibeplan
    user: vibeplan
